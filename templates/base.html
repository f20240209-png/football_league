<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            /* Background Image fixed in place */
            background: url("{{ url_for('static', filename='images/background.jpg') }}") no-repeat center center fixed; 
            background-size: cover;
            min-height: 100vh;
        }

        .navbar-brand { font-weight: bold; font-size: 1.5rem; }

        /* THE FIX IS HERE */
        .main-content {
            /* 0.8 means 80% visible, allowing the trophy to show through */
            background-color: rgba(255, 255, 255, 0.8); 
            
            /* This adds a "Frosted Glass" blur effect so text stays readable */
            backdrop-filter: blur(8px); 
            -webkit-backdrop-filter: blur(8px);

            padding: 30px;
            border-radius: 15px;
            margin-top: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='images/pl_logo.png') }}" 
                     alt="Premier League" 
                     style="height: 55px; margin-right: 10px;">
                Premier League
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">📊 Standings</a></li>
                    
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('fixtures') }}">📅 Fixtures</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('results') }}">✅ Results</a></li>
                    
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('teams_list') }}">🛡️ Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('top_scorers') }}">👟 Top Scorers</a></li>
                    <li class="nav-item"><a class="nav-link" href="{{ url_for('top_assists') }}">👟 Top Assists</a></li>
                    
                
                </ul>
            </div>
        </div>
    </nav>

    <div class="container main-content">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<div id="chat-wrapper" style="position: fixed; bottom: 30px; right: 30px; z-index: 9999;">
    <button id="chat-btn" onclick="toggleChat()" style="width: 60px; height: 60px; border-radius: 50%; background-color: #007bff; color: white; border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.3); cursor: pointer; font-size: 24px;">
        💬
    </button>

    <div id="chat-window" style="display: none; position: absolute; bottom: 80px; right: 0; width: 350px; height: 500px; background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); flex-direction: column; overflow: hidden; border: 1px solid #ddd;">
        
        <div style="background: #007bff; color: white; padding: 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center;">
            <span>PL AI Assistant 🤖</span>
            <button onclick="toggleChat()" style="background:none; border:none; color:white; cursor:pointer;">✕</button>
        </div>

        <div id="chat-content" style="flex-grow: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #f8f9fa;">
            <div style="background: #e9ecef; padding: 10px; border-radius: 10px; align-self: flex-start; max-width: 80%; font-size: 14px;">
                Hello! I'm your Premier League bot. Ask me about standings or teams!
            </div>
        </div>

        <div style="padding: 15px; border-top: 1px solid #eee; display: flex; gap: 10px;">
            <input type="text" id="user-input" placeholder="Type a message..." style="flex-grow: 1; border: 1px solid #ddd; border-radius: 20px; padding: 8px 15px; outline: none;">
            <button id="send-btn" onclick="sendMessage()" style="background: #007bff; color: white; border: none; border-radius: 50%; width: 35px; height: 35px; cursor: pointer;">➔</button>
        </div>
    </div>
</div>

<script>
// Toggle Chat Visibility
function toggleChat() {
    const window = document.getElementById('chat-window');
    window.style.display = (window.style.display === 'none' || window.style.display === '') ? 'flex' : 'none';
}

// Send Message to Flask
function sendMessage() {
    const input = document.getElementById('user-input');
    const content = document.getElementById('chat-content');
    const message = input.value.trim();

    if (message === "") return;

    // 1. Add User Message to UI
    content.innerHTML += `
        <div style="background: #007bff; color: white; padding: 10px; border-radius: 10px; align-self: flex-end; max-width: 80%; font-size: 14px;">
            ${message}
        </div>
    `;
    input.value = "";
    content.scrollTop = content.scrollHeight;

    // 2. Show "Typing..."
    const typingId = "typing-" + Date.now();
    content.innerHTML += `
        <div id="${typingId}" style="background: #e9ecef; padding: 10px; border-radius: 10px; align-self: flex-start; max-width: 80%; font-size: 14px; color: #666;">
            AI is thinking...
        </div>
    `;
    content.scrollTop = content.scrollHeight;

    // 3. Fetch from Backend
    fetch('/ask-ai', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: message })
    })
    .then(response => response.json())
    .then(data => {
        // Remove typing indicator
        const typingEl = document.getElementById(typingId);
        if(typingEl) typingEl.remove();

        // --- GRAPH LOGIC START ---
        let aiText = data.answer;
        let teamForGraph = null;
        
        // Check for [GRAPH: TeamName]
        const graphMatch = aiText.match(/\[GRAPH:\s*(.*?)\]/);
        
        if (graphMatch) {
            teamForGraph = graphMatch[1]; // Extract Team Name
            aiText = aiText.replace(graphMatch[0], ""); // Clean text
        }

        // Add AI Text Response
        // We use a div creation method here to allow HTML formatting (bolding)
        const msgDiv = document.createElement('div');
        msgDiv.style.background = "#e9ecef";
        msgDiv.style.padding = "10px";
        msgDiv.style.borderRadius = "10px";
        msgDiv.style.alignSelf = "flex-start";
        msgDiv.style.maxWidth = "80%";
        msgDiv.style.fontSize = "14px";
        // Convert markdown bold (**text**) to HTML bold (<b>text</b>) and newlines to <br>
        msgDiv.innerHTML = aiText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
        content.appendChild(msgDiv);

        // If Graph is needed, fetch data and draw it
        if (teamForGraph) {
            fetch(`/team-progress/${teamForGraph}`)
                .then(res => res.json())
                .then(graphData => {
                    if (graphData.error) return;

                    // Create Canvas Container
                    const canvasId = "chart-" + Date.now();
                    const graphDiv = document.createElement('div');
                    graphDiv.style.width = "100%";
                    graphDiv.style.height = "250px"; // Fixed height for chart
                    graphDiv.style.background = "white";
                    graphDiv.style.borderRadius = "10px";
                    graphDiv.style.marginTop = "5px";
                    graphDiv.style.padding = "5px";
                    graphDiv.style.border = "1px solid #ddd";
                    graphDiv.innerHTML = `<canvas id="${canvasId}"></canvas>`;
                    
                    content.appendChild(graphDiv);

                    // Draw Chart using Chart.js
                    new Chart(document.getElementById(canvasId), {
                        type: 'line',
                        data: {
                            labels: graphData.labels,
                            datasets: [{
                                label: `${graphData.team} Points`,
                                data: graphData.data,
                                borderColor: '#0d6efd',
                                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                                tension: 0.3,
                                fill: true,
                                pointRadius: 4
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { beginAtZero: true, title: {display:true, text:'Points'} }
                            }
                        }
                    });
                    
                    // Scroll to bottom after graph loads
                    content.scrollTop = content.scrollHeight;
                })
                .catch(err => console.error("Graph Error:", err));
        }
        // --- GRAPH LOGIC END ---

        content.scrollTop = content.scrollHeight;
    })
    .catch(error => {
        const typingEl = document.getElementById(typingId);
        if(typingEl) typingEl.innerHTML = "Error connecting to AI.";
    });
}

// Allow "Enter" key to send message
document.getElementById('user-input').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
